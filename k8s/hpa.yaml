apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itsm-web-hpa
  namespace: itsm
  labels:
    app.kubernetes.io/name: itsm-web
    app.kubernetes.io/part-of: itsm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: itsm-web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}ITSM Portal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f4f6fa;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: #172238;
            color: white;
            width: 250px;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
            padding: 25px 20px;
            border-bottom: 1px solid #34415a;
        }

        .sidebar-link {
            display: block;
            color: #bdc7d8;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: #293a59;
            color: white;
        }

        .main-content {
            min-width: 0;
            flex: 1;
        }

        .topbar {
            background: white;
            padding: 18px 28px;
            border-bottom: 1px solid #e5e7eb;
        }

        .content-area {
            padding: 28px;
        }

        .stat-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.04);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }

        .table-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        @media (max-width: 767px) {
            .sidebar {
                width: 70px;
            }

            .brand {
                font-size: 12px;
                padding: 20px 5px;
                text-align: center;
            }

            .sidebar-link {
                text-align: center;
                padding: 14px 5px;
                font-size: 12px;
            }

            .sidebar-link i {
                display: block;
                font-size: 20px;
            }

            .sidebar-link span {
                display: none;
            }

            .content-area {
                padding: 15px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="d-flex">

    <aside class="sidebar flex-shrink-0">
        <div class="brand">
            <i class="bi bi-headset"></i>
            <span> ITSM Portal</span>
        </div>

        <nav class="mt-3">
            <a href="{% url 'dashboard' %}" class="sidebar-link active">
                <i class="bi bi-grid"></i>
                <span> Dashboard</span>
            </a>

            <div class="sidebar-link">
                <i class="bi bi-ticket-perforated"></i>
                <span> Tickets</span>
            </div>

            <div class="sidebar-link">
                <i class="bi bi-tags"></i>
                <span> Categories</span>
            </div>

            <div class="sidebar-link">
                <i class="bi bi-people"></i>
                <span> Users</span>
            </div>

            <div class="sidebar-link">
                <i class="bi bi-bar-chart"></i>
                <span> Reports</span>
            </div>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar d-flex justify-content-between align-items-center">
            <div>
                <strong>IT Service Management</strong>
            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary">
                    <i class="bi bi-person-circle"></i>
                    {{ request.user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </button>
                </form>
            </div>
        </header>

        <section class="content-area">
            {% block content %}{% endblock %}
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
